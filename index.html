<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Architectural Renderer</title>
  <!-- Tailwind via CDN: zero build step, perfect for GitHub Pages -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header class="border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">
      <h1 class="text-xl font-semibold tracking-tight">Render<span class="text-amber-400">Studio</span></h1>
      <div class="flex items-center gap-2 text-sm text-slate-400">
        <span id="statusDot" class="inline-block w-2.5 h-2.5 rounded-full bg-slate-600"></span>
        <span id="statusText">Checking render PC…</span>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-8 grid lg:grid-cols-2 gap-8">
    <!-- LEFT: inputs -->
    <section class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">1. Sketch or clay render</label>
        <div id="dropzone"
             class="relative border-2 border-dashed border-slate-700 hover:border-amber-400 rounded-xl p-4 text-center cursor-pointer transition min-h-[240px] flex items-center justify-center">
          <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" class="hidden" />
          <div id="dropHint" class="text-slate-400">
            <p class="text-lg">Drag &amp; drop an image here</p>
            <p class="text-sm mt-1">or click to browse · PNG, JPG, WEBP</p>
          </div>
          <img id="preview" class="hidden max-h-[360px] rounded-lg object-contain" alt="Input preview" />
        </div>
      </div>

      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label for="roomType" class="block text-sm font-medium text-slate-300 mb-2">2. Room type</label>
          <select id="roomType" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 focus:outline-none focus:border-amber-400">
            <option value="living_room">Living Room</option>
            <option value="bedroom">Bedroom</option>
            <option value="kitchen">Kitchen</option>
            <option value="dining_room">Dining Room</option>
            <option value="bathroom">Bathroom</option>
            <option value="office">Home Office</option>
            <option value="exterior">Exterior</option>
          </select>
        </div>
        <div>
          <label for="style" class="block text-sm font-medium text-slate-300 mb-2">3. Design style</label>
          <select id="style" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 focus:outline-none focus:border-amber-400">
            <option value="nordic">Nordic</option>
            <option value="industrial">Industrial</option>
            <option value="luxury">Luxury</option>
            <option value="modern" selected>Modern</option>
            <option value="japandi">Japandi</option>
            <option value="classic">Classic</option>
          </select>
        </div>
      </div>

      <div>
        <label for="extra" class="block text-sm font-medium text-slate-300 mb-2">Extra details <span class="text-slate-500">(optional)</span></label>
        <input id="extra" maxlength="300" placeholder="e.g. green velvet sofa, large plants, evening light"
               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 focus:outline-none focus:border-amber-400" />
      </div>

      <button id="generateBtn" disabled
              class="w-full flex items-center justify-center gap-3 bg-amber-400 text-slate-900 font-semibold rounded-lg py-3 transition hover:bg-amber-300 disabled:opacity-40 disabled:cursor-not-allowed">
        <svg id="spinner" class="hidden animate-spin h-5 w-5" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
        </svg>
        <span id="btnLabel">Generate render</span>
      </button>

      <div id="errorBox" class="hidden rounded-lg border border-red-500/40 bg-red-500/10 text-red-300 px-4 py-3 text-sm"></div>
    </section>

    <!-- RIGHT: output -->
    <section>
      <label class="block text-sm font-medium text-slate-300 mb-2">Result</label>
      <div class="border border-slate-800 rounded-xl bg-slate-900 min-h-[360px] flex items-center justify-center p-4 relative">
        <p id="placeholder" class="text-slate-500">Your render will appear here.</p>
        <div id="loadingBox" class="hidden text-center text-slate-400">
          <p class="text-lg">Rendering…</p>
          <p class="text-sm mt-1">Usually 30–90 seconds. The first render after a restart can take a few minutes while the models load. <span id="elapsed">0</span>s</p>
        </div>
        <img id="resultImg" class="hidden max-h-[640px] rounded-lg object-contain" alt="Rendered result" />
      </div>
      <div id="resultActions" class="hidden mt-3 flex items-center justify-between text-sm text-slate-400">
        <span id="resultMeta"></span>
        <a id="downloadLink" download="render.png"
           class="px-3 py-1.5 rounded-lg border border-slate-700 hover:border-amber-400 hover:text-amber-300 transition">Download PNG</a>
      </div>
    </section>
  </main>
  <p class="text-center text-xs text-slate-600 pb-6">build v3 &middot; single file</p>

  <script>
// Shows any crash directly in the header so problems are visible without opening DevTools
window.addEventListener("error", (e) => {
  const t = document.getElementById("statusText");
  if (t) t.textContent = "Script error: " + e.message;
});
window.addEventListener("unhandledrejection", (e) => {
  console.error("Unhandled promise rejection:", e.reason);
});

// ==========================================
// Configuration
// ==========================================
const API_BASE = "https://render.everpick.co.in";

// Must match API_KEY in your backend .env. Leave "" if auth is disabled.
const API_KEY = "my_secure_random_key_123";

const HEALTH_INTERVAL_MS = 15000;
const HEALTH_TIMEOUT_MS = 5000;
const UPLOAD_TIMEOUT_MS = 60 * 1000;          // sending the sketch + queuing the job
const POLL_INTERVAL_MS = 2000;                // how often we ask "is it done yet?"
const RENDER_MAX_WAIT_MS = 15 * 60 * 1000;    // give up after 15 minutes

// ==========================================
// Elements (IDs match index.html exactly)
// ==========================================
const $ = (id) => document.getElementById(id);

const dropZone = $("dropzone");
const fileInput = $("fileInput");
const dropHint = $("dropHint");
const preview = $("preview");
const roomType = $("roomType");
const designStyle = $("style");
const extraDetails = $("extra");
const generateBtn = $("generateBtn");
const btnLabel = $("btnLabel");
const spinner = $("spinner");
const errorBox = $("errorBox");
const statusDot = $("statusDot");
const statusText = $("statusText");
const placeholder = $("placeholder");
const loadingBox = $("loadingBox");
const loadingTitle = loadingBox ? loadingBox.querySelector("p") : null;
const elapsedEl = $("elapsed");
const resultImg = $("resultImg");
const resultActions = $("resultActions");
const resultMeta = $("resultMeta");
const downloadLink = $("downloadLink");

// ==========================================
// State
// ==========================================
let selectedFile = null;
let serverOnline = false;
let isRendering = false;
let previewUrl = null;
let elapsedTimer = null;

// ==========================================
// Helpers
// ==========================================
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const authHeaders = () => (API_KEY ? { "X-API-Key": API_KEY } : {});

function setStatus(color, text) {
  if (statusDot) statusDot.style.backgroundColor = color;
  if (statusText) statusText.textContent = text;
}

function setLoadingText(text) {
  if (loadingTitle) loadingTitle.textContent = text;
}

function updateButton() {
  if (!generateBtn) return;
  generateBtn.disabled = !(serverOnline && selectedFile && !isRendering);
}

function showError(msg) {
  if (errorBox) {
    errorBox.textContent = msg;
    errorBox.classList.remove("hidden");
  } else {
    alert(msg);
  }
}

function hideError() {
  if (errorBox) errorBox.classList.add("hidden");
}

function setRendering(on) {
  isRendering = on;
  if (spinner) spinner.classList.toggle("hidden", !on);
  if (btnLabel) btnLabel.textContent = on ? "Rendering on RTX 4060 Ti…" : "Generate render";
  if (loadingBox) loadingBox.classList.toggle("hidden", !on);
  if (on) {
    setLoadingText("Sending your sketch…");
    if (placeholder) placeholder.classList.add("hidden");
    if (resultImg) resultImg.classList.add("hidden");
    if (resultActions) resultActions.classList.add("hidden");
    const start = Date.now();
    if (elapsedEl) elapsedEl.textContent = "0";
    elapsedTimer = setInterval(() => {
      if (elapsedEl) elapsedEl.textContent = Math.floor((Date.now() - start) / 1000);
    }, 1000);
  } else {
    clearInterval(elapsedTimer);
    elapsedTimer = null;
  }
  updateButton();
}

// Accepts a data URL, http(s) URL, relative path, or raw base64
function normalizeImageSrc(value) {
  if (!value || typeof value !== "string") return null;
  if (value.startsWith("data:") || value.startsWith("http")) return value;
  if (value.startsWith("/")) return API_BASE + value;
  return `data:image/png;base64,${value}`;
}

async function readError(response) {
  let detail = `Request failed (HTTP ${response.status})`;
  try {
    const data = await response.json();
    if (data.detail) detail = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail);
  } catch (_) {}
  return detail;
}

// ==========================================
// Status check (every 15 s, 5 s timeout)
// ==========================================
async function checkStatus() {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), HEALTH_TIMEOUT_MS);
  try {
    const res = await fetch(`${API_BASE}/health`, { signal: ctrl.signal, cache: "no-store" });
    const data = await res.json();

    if (data.status === "ok") {
      serverOnline = true;
      if (data.busy) {
        setStatus("#f59e0b", `Rendering… (${data.pending ?? 0} in queue)`);
      } else {
        setStatus("#10b981", "Render PC ready");
      }
    } else if (data.status === "comfyui_down") {
      serverOnline = false;
      setStatus("#ef4444", "ComfyUI is not running");
    } else {
      serverOnline = false;
      setStatus("#f59e0b", "Unexpected server status");
    }
  } catch (err) {
    serverOnline = false;
    setStatus("#ef4444", "Render PC offline");
  } finally {
    clearTimeout(timer);
    updateButton();
  }
}

// ==========================================
// File selection
// ==========================================
function handleFile(file) {
  if (!file) return;
  if (!/^image\/(png|jpeg|webp)$/.test(file.type)) {
    showError("Please choose a PNG, JPG or WEBP image.");
    return;
  }
  hideError();
  selectedFile = file;

  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(file);
  preview.src = previewUrl;
  preview.classList.remove("hidden");
  dropHint.classList.add("hidden");
  updateButton();
}

dropZone.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", (e) => handleFile(e.target.files[0]));

dropZone.addEventListener("dragover", (e) => {
  e.preventDefault();
  dropZone.classList.add("border-amber-400");
});
dropZone.addEventListener("dragleave", () => {
  dropZone.classList.remove("border-amber-400");
});
dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.classList.remove("border-amber-400");
  handleFile(e.dataTransfer.files[0]);
});

// ==========================================
// Render job polling
// ==========================================
async function pollJob(jobId) {
  const deadline = Date.now() + RENDER_MAX_WAIT_MS;
  let failures = 0;

  while (Date.now() < deadline) {
    await sleep(POLL_INTERVAL_MS);

    let job;
    try {
      const r = await fetch(`${API_BASE}/render/${jobId}`, { headers: authHeaders(), cache: "no-store" });
      if (!r.ok) {
        const err = new Error(await readError(r));
        err.fatal = r.status >= 400 && r.status < 500; // 401 / 404: retrying will not help
        throw err;
      }
      job = await r.json();
      failures = 0;
    } catch (e) {
      failures += 1;
      if (e.fatal || failures >= 5) {
        throw new Error(e.fatal ? e.message : "Lost connection to the render PC. " + e.message);
      }
      continue; // brief network hiccup, try again
    }

    if (job.status === "done") return job;
    if (job.status === "error") throw new Error(job.error || "Render failed.");

    if (job.status === "queued") {
      setLoadingText("Waiting for the GPU…");
    } else if (job.progress > 0) {
      setLoadingText(`Rendering… ${job.progress}%`);
    } else {
      setLoadingText("Loading models…");
    }
  }
  throw new Error("The render took too long. Check that the render PC is running.");
}

// ==========================================
// Generate render
// ==========================================
async function generateRender() {
  if (!selectedFile) {
    showError("Please upload a sketch or clay render first.");
    return;
  }

  hideError();
  setRendering(true);
  const startedAt = Date.now();

  const formData = new FormData();
  formData.append("file", selectedFile);
  formData.append("room_type", roomType.value);
  formData.append("style", designStyle.value);
  formData.append("extra_prompt", extraDetails.value.trim());

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), UPLOAD_TIMEOUT_MS);

  try {
    const response = await fetch(`${API_BASE}/render`, {
      method: "POST",
      headers: authHeaders(),
      body: formData,
      signal: ctrl.signal,
    });
    clearTimeout(timer);

    if (!response.ok) throw new Error(await readError(response));
    const first = await response.json();

    // New backend returns a job id; an older one returns the image directly.
    const result = first.image ? first : await pollJob(first.job_id);

    const src = normalizeImageSrc(result.image);
    if (!src) throw new Error("Server returned no image.");

    resultImg.src = src;
    resultImg.classList.remove("hidden");
    downloadLink.href = src;
    resultMeta.textContent = `Done in ${Math.round((Date.now() - startedAt) / 1000)}s`;
    resultActions.classList.remove("hidden");
  } catch (err) {
    if (placeholder) placeholder.classList.remove("hidden");
    showError(
      err.name === "AbortError"
        ? "Could not reach the render PC (upload timed out)."
        : err.message === "Failed to fetch"
        ? "Could not reach the render PC. Check that the backend and the tunnel are running."
        : err.message
    );
  } finally {
    clearTimeout(timer);
    setRendering(false);
  }
}

generateBtn.addEventListener("click", generateRender);

// ==========================================
// Start
// ==========================================
checkStatus();
setInterval(checkStatus, HEALTH_INTERVAL_MS);

  </script>
</body>
</html>

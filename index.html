<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Architectural Renderer</title>
  <!-- Tailwind via CDN: zero build step, perfect for GitHub Pages -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header class="border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">
      <h1 class="text-xl font-semibold tracking-tight">Render<span class="text-amber-400">Studio</span></h1>
      <div class="flex items-center gap-2 text-sm text-slate-400">
        <span id="statusDot" class="inline-block w-2.5 h-2.5 rounded-full bg-slate-600"></span>
        <span id="statusText">Checking render PC…</span>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-8 grid lg:grid-cols-2 gap-8">
    <!-- LEFT: inputs -->
    <section class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">1. Sketch or clay render</label>
        <div id="dropzone"
             class="relative border-2 border-dashed border-slate-700 hover:border-amber-400 rounded-xl p-4 text-center cursor-pointer transition min-h-[240px] flex items-center justify-center">
          <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" class="hidden" />
          <div id="dropHint" class="text-slate-400">
            <p class="text-lg">Drag &amp; drop an image here</p>
            <p class="text-sm mt-1">or click to browse · PNG, JPG, WEBP</p>
          </div>
          <img id="preview" class="hidden max-h-[360px] rounded-lg object-contain" alt="Input preview" />
        </div>
      </div>

      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label for="roomType" class="block text-sm font-medium text-slate-300 mb-2">2. Room type</label>
          <select id="roomType" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 focus:outline-none focus:border-amber-400">
            <option value="living_room">Living Room</option>
            <option value="bedroom">Bedroom</option>
            <option value="kitchen">Kitchen</option>
            <option value="dining_room">Dining Room</option>
            <option value="bathroom">Bathroom</option>
            <option value="office">Home Office</option>
            <option value="exterior">Exterior</option>
          </select>
        </div>
        <div>
          <label for="style" class="block text-sm font-medium text-slate-300 mb-2">3. Design style</label>
          <select id="style" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 focus:outline-none focus:border-amber-400">
            <option value="nordic">Nordic</option>
            <option value="industrial">Industrial</option>
            <option value="luxury">Luxury</option>
            <option value="modern" selected>Modern</option>
            <option value="japandi">Japandi</option>
            <option value="classic">Classic</option>
          </select>
        </div>
      </div>

      <div>
        <label for="extra" class="block text-sm font-medium text-slate-300 mb-2">Extra details <span class="text-slate-500">(optional)</span></label>
        <input id="extra" maxlength="300" placeholder="e.g. green velvet sofa, large plants, evening light"
               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 focus:outline-none focus:border-amber-400" />
      </div>

      <button id="generateBtn" disabled
              class="w-full flex items-center justify-center gap-3 bg-amber-400 text-slate-900 font-semibold rounded-lg py-3 transition hover:bg-amber-300 disabled:opacity-40 disabled:cursor-not-allowed">
        <svg id="spinner" class="hidden animate-spin h-5 w-5" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
        </svg>
        <span id="btnLabel">Generate render</span>
      </button>

      <div id="errorBox" class="hidden rounded-lg border border-red-500/40 bg-red-500/10 text-red-300 px-4 py-3 text-sm"></div>
    </section>

    <!-- RIGHT: output -->
    <section>
      <label class="block text-sm font-medium text-slate-300 mb-2">Result</label>
      <div class="border border-slate-800 rounded-xl bg-slate-900 min-h-[360px] flex items-center justify-center p-4 relative">
        <p id="placeholder" class="text-slate-500">Your render will appear here.</p>
        <div id="loadingBox" class="hidden text-center text-slate-400">
          <p class="text-lg">Rendering…</p>
          <p class="text-sm mt-1">Usually 30–90 seconds. The first render after a restart can take a few minutes while the models load. <span id="elapsed">0</span>s</p>
        </div>
        <img id="resultImg" class="hidden max-h-[640px] rounded-lg object-contain" alt="Rendered result" />
      </div>
      <div id="resultActions" class="hidden mt-3 flex items-center justify-between text-sm text-slate-400">
        <span id="resultMeta"></span>
        <a id="downloadLink" download="render.png"
           class="px-3 py-1.5 rounded-lg border border-slate-700 hover:border-amber-400 hover:text-amber-300 transition">Download PNG</a>
      </div>
    </section>
  </main>

  <!-- ?v=3 forces browsers and GitHub Pages to load the new app.js instead of a cached copy.
       Bump the number (v=4, v=5...) every time you change app.js. -->
  <script src="app.js?v=3"></script>
</body>
</html>
